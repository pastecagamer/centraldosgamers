<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Hub dos Gamers - Sua central definitiva de jogos, notícias, reviews e tendências do hardware quântico.">
    <meta name="keywords" content="blog gamer, hardware 2026, e-sports brasil, jogos indie, tecnologia gaming">
    <meta name="author" content="Hub Gamer">

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hubdosgamers.com/">
    <meta property="og:title" content="Hub dos Gamers | A Revolução dos Jogos">
    <meta property="og:description" content="Notícias, reviews e tudo sobre o universo gamer em 2026.">
    <meta property="og:image" content="https://hubdosgamers.com/assets/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://hubdosgamers.com/">
    <meta property="twitter:title" content="Hub dos Gamers | A Revolução dos Jogos">
    <meta property="twitter:description" content="Notícias, reviews e tudo sobre o universo gamer em 2026.">
    <meta property="twitter:image" content="https://hubdosgamers.com/assets/og-image.jpg">

    <title>Hub dos Gamers | A Revolução dos Jogos</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <div class="container">
            <nav style="justify-content: center;">
                <div class="logo">HUB<span style="color: var(--secondary);">GAMER</span></div>
            </nav>
        </div>
    </header>



    <!-- Seção de Postagens -->
    <section class="features" id="posts">
        <div class="container">
            <div class="section-title">
                <h2>Últimas Postagens</h2>
            </div>

            <!-- Filtro de Categorias Personalizado -->
            <div class="filter-wrapper">
                <div class="custom-dropdown" id="category-dropdown">
                    <div class="dropdown-header">
                        <span id="selected-category">Todas as Categorias</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <ul class="dropdown-list">
                        <li data-value="all">Todas as Categorias</li>
                        <li data-value="Vazamentos">Vazamentos</li>
                        <li data-value="Indie">Indie</li>
                        <li data-value="E-sports">E-sports</li>
                        <li data-value="Streaming">Streaming</li>
                        <li data-value="Hardware">Hardware</li>
                        <li data-value="Inovação">Inovação</li>
                    </ul>
                </div>
            </div>

            <div class="grid" id="posts-grid">
                <!-- Posts serão renderizados aqui pelo JavaScript -->
            </div>
        </div>
    </section>

    <script src="main.js"></script>
</body>

</html>
